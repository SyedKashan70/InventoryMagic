<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- <header style="background-color:#003d6b; padding:.5em" class="slds-grid slds-wrap slds-col slds-small-size_12-of-12 slds-medium-size_12-of-12 slds-large-size_12-of-12">
                
                <div class="slds-col slds-small-size_12-of-12 slds-medium-size_12-of-12 slds-large-size_12-of-12">

                  <h2 style="text-align:center; color: #fff;" class="slds-text-heading_medium">Add Serial Numbers</h2>
                </div>
               
              </header> -->


              <header style="background-color:#003d6b; padding:.5em" class="slds-grid slds-wrap slds-size_12-of-12">
                 <div class="slds-grid slds-wrap slds-size_12-of-12">
                <div class="slds-col slds-small-size_0-of-12 slds-medium-size_1-of-12 slds-large-size_1-of-12"></div>
                <div class="slds-col slds-small-size_12-of-12 slds-medium-size_11-of-12 slds-large-size_11-of-12">
                    <div style="float: left;" class="home_div">
                        <img src={iconAddSerial_anim} class="img-anim">
                        <img src={iconAddSerial_still} class="img-still">
                      </div>
                    <h2 style="color:#fff" class="slds-text-heading_medium">&nbsp;&nbsp;Add Serial Numbers</h2>
                </div>
            </div>
                </header>










            <!-- Modal Header -->
            <!-- <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium">Add Serial Numbers</h2>
            </header> -->

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">
                <div class="slds-scrollable_y" style="max-height: 300px;">
                    <template for:each={serialNumbers} for:item="serial" for:index="index">
                        <div class="slds-form-element slds-m-bottom_small" key={serial.recordId}>
                            <lightning-input 
                                label="Serial Number"
                                value={serial.serialNumber}
                                data-index={index}
                                onchange={handleSerialNumberChange}
                                required>
                            </lightning-input>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleClose}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSave} disabled={isSaveDisabled}>Save</button>
            </footer>
        </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
